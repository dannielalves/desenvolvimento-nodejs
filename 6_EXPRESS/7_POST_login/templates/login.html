<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Servidor</title>
</head>
<body>
    <nav>
        <ul>
            <li>
                <a href="/">Home</a>
            </li>
        </ul>
    </nav>
    <br>
    <div>
        <h1>Faça login:</h1>
        <form action="/painel" method="post">
            <div>
                <input type="text" name="user" placeholder="Usuário" required autocomplete="off">
            </div>
            <div>
                <input type="password" name="pass" placeholder="Senha" required autocomplete="off">
            </div>
            <div>
                <input type="submit" value="Login">
            </div>
        </form>
    </div>
</body>
</html>
