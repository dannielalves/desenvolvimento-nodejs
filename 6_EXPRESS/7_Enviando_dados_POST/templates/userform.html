<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Cadastrar usuário</title>
</head>
<body>
      <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="users/create">Cadastrar Usuário</a></li>
        </ul>
    </nav>
    <hr>
    <h1>Cadastrar Usuário</h1>
    <div>
        <form action="/users/save" method="post">
            <div>
                <label for="name">Nome: </label>
                <input type="text" name="name" placeholder="Nome" minlength="3" autocomplete="off" required>
            </div>
            <div>
                <label for="job">Profissão: </label>
                <input type="text" name="jog" minlength="3" placeholder="Profissão" autocapitalize="off" required>
            </div>
            <div>
                <input type="submit" value="Cadastrar">
            </div>
        </form>
    </div>
</body>
</html>
